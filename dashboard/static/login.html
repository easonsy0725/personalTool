<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 / 註冊系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-[#F4F6F8] text-[#111827] min-h-screen flex items-center justify-center p-4 font-sans">

  <div id="app" class="w-full max-w-sm bg-white p-6 rounded shadow-md border border-gray-200">
    
    <div class="flex border-b mb-6 text-sm font-bold">
      <button 
        @click="isRegister = false" 
        :class="!isRegister ? 'border-b-2 border-black text-black' : 'text-gray-400 hover:text-gray-600'" 
        class="flex-1 pb-2 text-center transition">
        LOGIN
      </button>
      <button 
        @click="isRegister = true" 
        :class="isRegister ? 'border-b-2 border-black text-black' : 'text-gray-400 hover:text-gray-600'" 
        class="flex-1 pb-2 text-center transition">
        REGISTER
      </button>
    </div>

    <h1 class="text-xl font-black text-center tracking-wide uppercase mb-6">
      {{ isRegister ? 'Create Account' : 'Welcome Back' }}
    </h1>

    <form @submit.prevent="handleSubmit" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Username (登入帳號)</label>
        <input 
          v-model="username" 
          type="text" 
          required 
          class="w-full bg-gray-50 border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:border-black rounded-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Password (登入密碼)</label>
        <input 
          v-model="password" 
          type="password" 
          required 
          class="w-full bg-gray-50 border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:border-black rounded-none">
      </div>

      <template v-if="isRegister">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Display Name (顯示名稱)</label>
          <input 
            v-model="displayName" 
            type="text" 
            placeholder="例如: 小明 / Kelvin"
            class="w-full bg-gray-50 border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:border-black rounded-none">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Role (帳號權限)</label>
          <select 
            v-model="role" 
            class="w-full bg-gray-50 border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:border-black rounded-none">
            <option value="employee">一般員工 (Employee)</option>
            <option value="accounting">會計審核員 (Accounting)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Company (所屬公司)</label>
          <input 
            v-model="company" 
            type="text" 
            placeholder="例如: 預設公司"
            class="w-full bg-gray-50 border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:border-black rounded-none">
        </div>
      </template>

      <div v-if="errorMessage" class="text-xs text-red-500 font-bold text-center">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="w-full bg-black text-white font-bold py-2 text-sm tracking-wider uppercase hover:bg-gray-800 transition">
        {{ isRegister ? 'Register' : 'Login' }}
      </button>
    </form>

    <div class="mt-4 text-center">
      <button @click="isRegister = !isRegister" class="text-xs text-gray-500 underline hover:text-black">
        {{ isRegister ? '已有帳號？點此登入' : '還沒有帳號？點此註冊' }}
      </button>
    </div>

  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const isRegister = ref(false);
        const username = ref('');
        const password = ref('');
        const displayName = ref('');
        const role = ref('employee');
        const company = ref('預設公司');
        const errorMessage = ref('');

        const handleSubmit = async () => {
          errorMessage.value = '';
          const endpoint = isRegister.value ? '/api/register' : '/api/login';
          
          const payload = isRegister.value 
            ? { username: username.value, password: password.value, display_name: displayName.value, role: role.value, company: company.value }
            : { username: username.value, password: password.value };

          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (!res.ok) {
              errorMessage.value = data.error || data.message || '操作失敗';
              return;
            }

            if (isRegister.value) {
              alert('註冊成功！請直接登入');
              isRegister.value = false;
            } else {
              if (data.role === 'accounting') {
                window.location.href = '/accounting.html';
              } else {
                window.location.href = '/';
              }
            }
          } catch (err) {
            errorMessage.value = '無法連線至伺服器';
          }
        };

        return {
          isRegister, username, password, displayName, role, company, errorMessage, handleSubmit
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
