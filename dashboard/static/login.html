<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Work Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF9F6] text-[#191919] min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="bg-white border border-[#111111] p-6 max-w-sm w-full space-y-4 shadow-sm">
    <h2 id="title" class="text-base font-bold text-center font-mono tracking-wider">ACCOUNT LOGIN</h2>
    
    <form id="authForm" onsubmit="return false;" class="space-y-3 font-mono text-xs">
      <div>
        <label class="block text-[#737373] mb-1">USERNAME</label>
        <input type="text" id="username" autocomplete="username" required class="w-full bg-[#F5F5F3] border border-[#E5E5E5] p-2 outline-none">
      </div>
      <div>
        <label class="block text-[#737373] mb-1">PASSWORD</label>
        <input type="password" id="password" autocomplete="current-password" required class="w-full bg-[#F5F5F3] border border-[#E5E5E5] p-2 outline-none">
      </div>
      
      <div id="msg" class="text-red-500 text-[10px] hidden font-mono"></div>
      
      <button type="button" id="submitBtn" class="w-full bg-[#111111] text-white py-2 font-bold hover:opacity-90 transition">LOGIN</button>
    </form>

    <div class="text-center pt-2 border-t font-mono text-[10px]">
      <button type="button" id="toggleBtn" class="text-[#737373] underline">沒有帳號？點此註冊</button>
    </div>
  </div>

  <script>
    let isRegister = false;
    const toggleBtn = document.getElementById('toggleBtn');
    const title = document.getElementById('title');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    toggleBtn.addEventListener('click', () => {
      isRegister = !isRegister;
      title.innerText = isRegister ? 'CREATE ACCOUNT' : 'ACCOUNT LOGIN';
      submitBtn.innerText = isRegister ? 'REGISTER' : 'LOGIN';
      toggleBtn.innerText = isRegister ? '已有帳號？點此登入' : '沒有帳號？點此註冊';
      msg.classList.add('hidden');
    });

    submitBtn.addEventListener('click', async () => {
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      if (!usernameInput || !passwordInput) {
        msg.innerText = '請輸入帳號與密碼';
        msg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'PROCESSING...';
      msg.classList.add('hidden');

      const endpoint = isRegister ? '/api/register' : '/api/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await res.json();

        if (res.ok) {
          if (isRegister) {
            alert('註冊成功！請直接登入');
            toggleBtn.click();
            document.getElementById('password').value = '';
          } else {
            window.location.href = '/';
          }
        } else {
          msg.innerText = data.detail || '操作失敗';
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.innerText = '網路連線失敗，請稍後再試';
        msg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = isRegister ? 'REGISTER' : 'LOGIN';
      }
    });
  </script>
</body>
</html>
