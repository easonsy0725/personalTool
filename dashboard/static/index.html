<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工時與薪資記錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 主容器：寬螢幕滿版 -->
    <div class="w-full px-4 py-6 md:px-8">
        
        <!-- 頂部標題與帳號列 -->
        <div class="flex justify-between items-center border-b pb-4 mb-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 inline-block mr-4">工時與薪資記錄系統</h1>
                <button onclick="openSettingsModal()" class="text-sm text-gray-500 hover:text-gray-700 mr-2">[偏好與公司設定]</button>
                <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">[登出]</button>
            </div>
            <div class="flex items-center space-x-2 text-sm">
                <span class="text-gray-600">目前帳號:</span>
                <span id="currentUsername" class="font-bold text-gray-800 uppercase">--</span>
                <span id="currentRoleBadge" class="bg-black text-white text-xs px-2 py-0.5 rounded">管理者</span>
            </div>
        </div>

        <!-- 審核目標員工列 -->
        <div class="bg-gray-200/60 p-3 rounded-lg flex items-center space-x-3 mb-6">
            <label for="employeeSelect" class="font-medium text-gray-700">審核目標員工:</label>
            <select id="employeeSelect" onchange="handleUserChange()" class="border border-gray-300 rounded px-4 py-1.5 text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 min-w-[160px]">
                <option value="">載入中...</option>
            </select>
        </div>

        <!-- 年月切換與總數資訊 -->
        <div class="mb-6">
            <div class="flex items-center space-x-6 mb-2">
                <span id="currentYearMonth" class="text-3xl font-bold text-gray-800">-- 年 -- 月</span>
                <div class="space-x-2 text-sm text-blue-600 font-medium">
                    <button onclick="changeMonth(-1)" class="hover:underline">上個月</button>
                    <span>/</span>
                    <button onclick="changeMonth(1)" class="hover:underline">下個月</button>
                </div>
            </div>
            <div class="text-gray-800 text-lg space-y-1 font-medium">
                <div>總工時: <span id="totalHours">0 天 0 小時</span></div>
                <div>總薪資: <span id="totalSalary">$0</span></div>
            </div>
        </div>

        <!-- 各公司小計 -->
        <div class="mb-6">
            <div class="text-sm text-gray-600 mb-2 font-medium">各公司工時與薪資小計:</div>
            <div id="companyBreakdown" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="bg-gray-100 p-3 rounded border text-gray-400">無紀錄</div>
            </div>
        </div>

        <!-- 月曆視圖 -->
        <div class="border rounded-lg bg-white overflow-hidden shadow-sm">
            <div class="grid grid-cols-7 gap-px bg-gray-200 text-center text-sm font-medium text-gray-600 border-b">
                <div class="bg-white py-2">週日</div>
                <div class="bg-white py-2">週一</div>
                <div class="bg-white py-2">週二</div>
                <div class="bg-white py-2">週三</div>
                <div class="bg-white py-2">週四</div>
                <div class="bg-white py-2">週五</div>
                <div class="bg-white py-2">週六</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-px bg-gray-200">
                <!-- 日曆格子由 JS 動態生成 -->
            </div>
        </div>

    </div>

    <!-- 偏好與公司設定 彈出視窗 (Settings Modal) -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-xl font-bold text-gray-800">偏好與公司設定</h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            
            <div class="space-y-4 text-sm">
                <!-- 每日標準工時 -->
                <div>
                    <label class="block font-medium text-gray-700 mb-1">每日標準工時 (換算天數用)</label>
                    <input type="number" id="settingStandardHours" value="8" class="w-full border border-gray-300 rounded px-3 py-2 text-gray-800">
                </div>

                <!-- 常用公司清單 -->
                <div>
                    <label class="block font-medium text-gray-700 mb-1">常用公司清單</label>
                    <div id="companyList" class="space-y-2 mb-2">
                        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded border">
                            <span class="font-medium text-gray-800">策高</span>
                            <span class="text-xs text-gray-400 border px-1.5 py-0.5 rounded bg-white">預設</span>
                        </div>
                        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded border">
                            <span class="font-medium text-gray-800">海洋公園</span>
                            <span class="text-xs text-gray-400 border px-1.5 py-0.5 rounded bg-white">預設</span>
                        </div>
                    </div>
                </div>

                <!-- 顯示樣式選項 -->
                <div>
                    <label class="block font-medium text-gray-700 mb-1">系統主題 / 顯示樣式</label>
                    <select class="w-full border border-gray-300 rounded px-3 py-2 text-gray-800">
                        <option value="light">標準明亮模式</option>
                        <option value="dark">暗黑樣式模式</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-3 border-t">
                <button type="button" onclick="closeSettingsModal()" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-100">關閉</button>
                <button type="button" onclick="saveSettings()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 系統腳本 -->
    <script>
        let currentDate = new Date();
        let activeUser = '';
        let loggedInUser = '';

        async function init() {
            try {
                const meRes = await fetch('/api/me');
                if (!meRes.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const meData = await meRes.json();
                loggedInUser = meData.username;
                activeUser = loggedInUser;

                document.getElementById('currentUsername').textContent = loggedInUser;
                document.getElementById('currentRoleBadge').textContent = meData.role === 'admin' ? '管理者' : '一般員工';

                await loadUserDropdown();
                await renderDashboard();
            } catch (err) {
                console.error('初始化失敗:', err);
            }
        }

        async function loadUserDropdown() {
            const usersRes = await fetch('/api/users');
            const users = await usersRes.json();
            
            const selectEl = document.getElementById('employeeSelect');
            selectEl.innerHTML = '';

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                
                if (user.toLowerCase() === loggedInUser.toLowerCase()) {
                    option.selected = true;
                }
                selectEl.appendChild(option);
            });
        }

        function handleUserChange() {
            const selectEl = document.getElementById('employeeSelect');
            activeUser = selectEl.value;
            renderDashboard();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderDashboard();
        }

        async function renderDashboard() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;

            document.getElementById('currentYearMonth').textContent = `${year} 年 ${month} 月`;

            const res = await fetch(`/api/work/${year}/${month}?target_user=${encodeURIComponent(activeUser)}`);
            if (!res.ok) return;

            const data = await res.json();
            const summary = data.summary || { total_hours: 0, total_salary: 0, by_company: {} };
            const logs = data.logs || {};

            const days = (summary.total_hours / 8).toFixed(1).replace(/\.0$/, '');
            const hours = summary.total_hours % 8;
            document.getElementById('totalHours').textContent = `${days} 天 ${hours} 小時`;
            document.getElementById('totalSalary').textContent = `$${summary.total_salary.toLocaleString()}`;

            const breakdownEl = document.getElementById('companyBreakdown');
            breakdownEl.innerHTML = '';
            const companies = Object.keys(summary.by_company);

            if (companies.length === 0) {
                breakdownEl.innerHTML = '<div class="bg-gray-100 p-3 rounded border text-gray-400">無紀錄</div>';
            } else {
                companies.forEach(comp => {
                    const compData = summary.by_company[comp];
                    const cDays = (compData.hours / 8).toFixed(1).replace(/\.0$/, '');

                    const item = document.createElement('div');
                    item.className = 'bg-gray-100/80 p-3 rounded border flex justify-between items-center text-base';
                    item.innerHTML = `
                        <div class="flex items-center space-x-2">
                            <span>🏢</span>
                            <span class="font-bold text-gray-800">${comp}</span>
                        </div>
                        <div class="font-bold text-gray-900">
                            ${cDays} 天 <span class="mx-1">|</span> $${compData.salary.toLocaleString()}
                        </div>
                    `;
                    breakdownEl.appendChild(item);
                });
            }

            renderCalendarGrid(year, month, logs);
        }

        function renderCalendarGrid(year, month, logs) {
            const gridEl = document.getElementById('calendarGrid');
            gridEl.innerHTML = '';

            const firstDay = new Date(year, month - 1, 1).getDay();
            const totalDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'bg-gray-50 min-h-[110px] p-2';
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayLogs = logs[dateKey] || [];

                const dayCell = document.createElement('div');
                dayCell.className = `min-h-[110px] p-2 relative flex flex-col justify-between ${
                    dayLogs.length > 0 ? 'bg-black text-white' : 'bg-white text-gray-800'
                }`;

                let topBadge = '';
                let bottomInfo = '';

                if (dayLogs.length > 0) {
                    topBadge = `<span class="bg-gray-700 text-white text-xs px-1.5 py-0.5 rounded">${dayLogs.length} 筆工作</span>`;
                    
                    const comp = dayLogs[0].company || '';
                    const salary = dayLogs[0].salary || (dayLogs[0].hours * dayLogs[0].rate) || 0;
                    bottomInfo = `<div class="text-xs text-gray-300 font-mono">[${comp}] +$${salary}</div>`;
                }

                dayCell.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-base">${day}</span>
                        ${topBadge}
                    </div>
                    ${bottomInfo}
                `;
                gridEl.appendChild(dayCell);
            }
        }

        /* 控制設定彈窗 */
        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            closeSettingsModal();
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        window.onload = init;
    </script>
</body>
</html>
