<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工時與薪資記錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-6">
        
        <!-- 頂部帳號資訊欄 -->
        <div class="border-b pb-4">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-2xl font-bold text-gray-800">工時與薪資記錄系統</h1>
                <div class="space-x-2">
                    <button onclick="openSettings()" class="text-sm text-gray-500 hover:text-gray-700">[偏好與公司設定]</button>
                    <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">[登出]</button>
                </div>
            </div>
            <div class="flex items-center space-x-2 text-sm">
                <span class="text-gray-600">目前帳號:</span>
                <span id="currentUsername" class="font-bold text-gray-800 uppercase">--</span>
                <span id="currentRoleBadge" class="bg-black text-white text-xs px-2 py-0.5 rounded">管理者</span>
            </div>
        </div>

        <!-- 選擇審核目標員工 -->
        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border">
            <label for="employeeSelect" class="font-medium text-gray-700">審核目標員工:</label>
            <select id="employeeSelect" onchange="handleUserChange()" class="border border-gray-300 rounded px-3 py-1.5 text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">載入中...</option>
            </select>
        </div>

        <!-- 月份切換欄 -->
        <div class="flex justify-between items-center py-2">
            <div>
                <span id="currentYearMonth" class="text-2xl font-bold text-gray-800">-- 年 -- 月</span>
            </div>
            <div class="space-x-2 text-sm text-blue-600">
                <button onclick="changeMonth(-1)" class="hover:underline">上個月</button>
                <span>/</span>
                <button onclick="changeMonth(1)" class="hover:underline">下個月</button>
            </div>
        </div>

        <!-- 月度總計 -->
        <div class="text-gray-700 space-y-1">
            <div>總工時: <span id="totalHours" class="font-semibold text-gray-900">0 天 0 小時</span></div>
            <div>總薪資: <span id="totalSalary" class="font-semibold text-gray-900">$0</span></div>
        </div>

        <!-- 各公司小計 -->
        <div class="border rounded-lg p-4 bg-gray-50 space-y-3">
            <h2 class="text-sm font-medium text-gray-600">各公司工時與薪資小計:</h2>
            <div id="companyBreakdown" class="space-y-2">
                <div class="text-sm text-gray-400">無紀錄</div>
            </div>
        </div>

        <!-- 月曆日曆視圖 -->
        <div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-500 mb-2">
                <div>週日</div>
                <div>週一</div>
                <div>週二</div>
                <div>週三</div>
                <div>週四</div>
                <div>週五</div>
                <div>週六</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-sm border-t pt-2">
                <!-- 日曆表格由 JS 動態生成 -->
            </div>
        </div>

    </div>

    <!-- 前端核心 JavaScript 邏輯 -->
    <script>
        let currentDate = new Date();
        let activeUser = '';
        let loggedInUser = '';

        async function init() {
            try {
                // 1. 取得當前登入者資訊
                const meRes = await fetch('/api/me');
                if (!meRes.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const meData = await meRes.json();
                loggedInUser = meData.username;
                activeUser = loggedInUser;

                // 更新畫面顯示當前使用者
                document.getElementById('currentUsername').textContent = loggedInUser;
                document.getElementById('currentRoleBadge').textContent = meData.role === 'admin' ? '管理者' : '一般員工';

                // 2. 載入所有使用者列表至下拉選單
                await loadUserDropdown();

                // 3. 預設帶入登入者本人資料進行渲染
                await renderDashboard();
            } catch (err) {
                console.error('初始化失敗:', err);
            }
        }

        async function loadUserDropdown() {
            const usersRes = await fetch('/api/users');
            const users = await usersRes.json();
            
            const selectEl = document.getElementById('employeeSelect');
            selectEl.innerHTML = '';

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                
                // 核心邏輯：如果該選項符合目前登入者，強制設為預設選中 (selected)
                if (user.toLowerCase() === loggedInUser.toLowerCase()) {
                    option.selected = true;
                }
                selectEl.appendChild(option);
            });
        }

        function handleUserChange() {
            const selectEl = document.getElementById('employeeSelect');
            activeUser = selectEl.value;
            renderDashboard();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderDashboard();
        }

        async function renderDashboard() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;

            document.getElementById('currentYearMonth').textContent = `${year} 年 ${month} 月`;

            const res = await fetch(`/api/work/${year}/${month}?target_user=${encodeURIComponent(activeUser)}`);
            if (!res.ok) return;

            const data = await res.json();
            const summary = data.summary || { total_hours: 0, total_salary: 0, by_company: {} };
            const logs = data.logs || {};

            // 渲染總工時與薪資
            const days = Math.floor(summary.total_hours / 8);
            const hours = summary.total_hours % 8;
            document.getElementById('totalHours').textContent = `${days} 天 ${hours} 小時`;
            document.getElementById('totalSalary').textContent = `$${summary.total_salary.toLocaleString()}`;

            // 渲染各公司小計
            const breakdownEl = document.getElementById('companyBreakdown');
            breakdownEl.innerHTML = '';
            const companies = Object.keys(summary.by_company);

            if (companies.length === 0) {
                breakdownEl.innerHTML = '<div class="text-sm text-gray-400">無紀錄</div>';
            } else {
                companies.forEach(comp => {
                    const compData = summary.by_company[comp];
                    const cDays = Math.floor(compData.hours / 8);
                    const cHours = compData.hours % 8;
                    const timeStr = cDays > 0 ? `${cDays} 天 ${cHours} 小時` : `${cHours} 小時`;

                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center bg-white p-2.5 rounded border text-sm';
                    item.innerHTML = `
                        <div>🏢 <span class="font-medium">${comp}</span></div>
                        <div class="text-right">
                            <span class="font-semibold">${timeStr}</span> | 
                            <span class="font-bold text-gray-900">$${compData.salary.toLocaleString()}</span>
                        </div>
                    `;
                    breakdownEl.appendChild(item);
                });
            }

            // 渲染月曆網格
            renderCalendarGrid(year, month, logs);
        }

        function renderCalendarGrid(year, month, logs) {
            const gridEl = document.getElementById('calendarGrid');
            gridEl.innerHTML = '';

            const firstDay = new Date(year, month - 1, 1).getDay();
            const totalDays = new Date(year, month, 0).getDate();

            // 補齊月首空白格子
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-16 border rounded bg-gray-50';
                gridEl.appendChild(emptyCell);
            }

            // 繪製每日格子
            for (let day = 1; day <= totalDays; day++) {
                const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayLogs = logs[dateKey] || [];

                const dayCell = document.createElement('div');
                dayCell.className = `h-16 border rounded p-1 text-left relative text-xs flex flex-col justify-between ${
                    dayLogs.length > 0 ? 'bg-black text-white' : 'bg-white text-gray-800'
                }`;

                let logContent = '';
                if (dayLogs.length > 0) {
                    const compName = dayLogs[0].company.substring(0, 2);
                    logContent = `<div class="bg-gray-800 text-white rounded px-1 py-0.5 text-[10px] truncate">1 筆工作 [${compName}...]</div>`;
                }

                dayCell.innerHTML = `
                    <div class="font-bold">${day}</div>
                    ${logContent}
                `;
                gridEl.appendChild(dayCell);
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        function openSettings() {
            alert('功能開發中');
        }

        // 頁面載入完成後執行 init
        window.onload = init;
    </script>
</body>
</html>
