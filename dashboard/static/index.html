<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工時與薪資記錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-6">
        
        <!-- 頂部帳號資訊欄 -->
        <div class="border-b pb-4">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-2xl font-bold text-gray-800">工時與薪資記錄系統</h1>
                <div class="space-x-2">
                    <button onclick="openSettings()" class="text-sm text-gray-500 hover:text-gray-700">[偏好與公司設定]</button>
                    <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700">[登出]</button>
                </div>
            </div>
            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center space-x-2">
                    <span class="text-gray-600">目前帳號:</span>
                    <span id="currentUsername" class="font-bold text-gray-800 uppercase">--</span>
                    <span id="currentRoleBadge" class="bg-black text-white text-xs px-2 py-0.5 rounded">管理者</span>
                </div>
                <button onclick="openAddModal()" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded font-medium hover:bg-blue-700">+ 新增工時</button>
            </div>
        </div>

        <!-- 選擇審核目標員工 -->
        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border">
            <label for="employeeSelect" class="font-medium text-gray-700">審核目標員工:</label>
            <select id="employeeSelect" onchange="handleUserChange()" class="border border-gray-300 rounded px-3 py-1.5 text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">載入中...</option>
            </select>
        </div>

        <!-- 月份切換欄 -->
        <div class="flex justify-between items-center py-2">
            <div>
                <span id="currentYearMonth" class="text-2xl font-bold text-gray-800">-- 年 -- 月</span>
            </div>
            <div class="space-x-2 text-sm text-blue-600">
                <button onclick="changeMonth(-1)" class="hover:underline">上個月</button>
                <span>/</span>
                <button onclick="changeMonth(1)" class="hover:underline">下個月</button>
            </div>
        </div>

        <!-- 月度總計 -->
        <div class="text-gray-700 space-y-1">
            <div>總工時: <span id="totalHours" class="font-semibold text-gray-900">0 天 0 小時</span></div>
            <div>總薪資: <span id="totalSalary" class="font-semibold text-gray-900">$0</span></div>
        </div>

        <!-- 各公司小計 -->
        <div class="border rounded-lg p-4 bg-gray-50 space-y-3">
            <h2 class="text-sm font-medium text-gray-600">各公司工時與薪資小計:</h2>
            <div id="companyBreakdown" class="space-y-2">
                <div class="text-sm text-gray-400">無紀錄</div>
            </div>
        </div>

        <!-- 月曆視圖 -->
        <div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-500 mb-2">
                <div>週日</div><div>週一</div><div>週二</div><div>週三</div><div>週四</div><div>週五</div><div>週六</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-sm border-t pt-2">
                <!-- 由 JS 動態生成 -->
            </div>
        </div>

    </div>

    <!-- 新增 / 編輯工時彈出視窗 (Modal) -->
    <div id="workModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800">新增工時紀錄</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <form id="workForm" onsubmit="saveWorkLog(event)" class="space-y-3 text-sm">
                <input type="hidden" id="logId">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">日期</label>
                    <input type="date" id="logDate" required class="w-full border rounded px-3 py-2 border-gray-300">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">公司名稱</label>
                    <input type="text" id="logCompany" required placeholder="請輸入公司名稱" class="w-full border rounded px-3 py-2 border-gray-300">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">工時 (小時)</label>
                        <input type="number" step="0.5" id="logHours" required placeholder="例如: 8" class="w-full border rounded px-3 py-2 border-gray-300">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">時薪 / 時數計算比率</label>
                        <input type="number" step="1" id="logRate" required placeholder="例如: 200" class="w-full border rounded px-3 py-2 border-gray-300">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">計薪模式</label>
                        <select id="logPayMode" class="w-full border rounded px-3 py-2 border-gray-300">
                            <option value="時薪">時薪</option>
                            <option value="日薪">日薪</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">狀態</label>
                        <select id="logStatus" class="w-full border rounded px-3 py-2 border-gray-300">
                            <option value="正常">正常</option>
                            <option value="審核中">審核中</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-1">工作地點</label>
                    <input type="text" id="logLocation" placeholder="選填" class="w-full border rounded px-3 py-2 border-gray-300">
                </div>
                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-100">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-medium">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 腳本 -->
    <script>
        let currentDate = new Date();
        let activeUser = '';
        let loggedInUser = '';

        async function init() {
            try {
                const meRes = await fetch('/api/me');
                if (!meRes.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const meData = await meRes.json();
                loggedInUser = meData.username;
                activeUser = loggedInUser;

                document.getElementById('currentUsername').textContent = loggedInUser;
                document.getElementById('currentRoleBadge').textContent = meData.role === 'admin' ? '管理者' : '一般員工';

                await loadUserDropdown();
                await renderDashboard();
            } catch (err) {
                console.error('初始化失敗:', err);
            }
        }

        async function loadUserDropdown() {
            const usersRes = await fetch('/api/users');
            const users = await usersRes.json();
            
            const selectEl = document.getElementById('employeeSelect');
            selectEl.innerHTML = '';

            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                
                if (user.toLowerCase() === loggedInUser.toLowerCase()) {
                    option.selected = true;
                }
                selectEl.appendChild(option);
            });
        }

        function handleUserChange() {
            const selectEl = document.getElementById('employeeSelect');
            activeUser = selectEl.value;
            renderDashboard();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderDashboard();
        }

        async function renderDashboard() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;

            document.getElementById('currentYearMonth').textContent = `${year} 年 ${month} 月`;

            const res = await fetch(`/api/work/${year}/${month}?target_user=${encodeURIComponent(activeUser)}`);
            if (!res.ok) return;

            const data = await res.json();
            const summary = data.summary || { total_hours: 0, total_salary: 0, by_company: {} };
            const logs = data.logs || {};

            const days = Math.floor(summary.total_hours / 8);
            const hours = summary.total_hours % 8;
            document.getElementById('totalHours').textContent = `${days} 天 ${hours} 小時`;
            document.getElementById('totalSalary').textContent = `$${summary.total_salary.toLocaleString()}`;

            const breakdownEl = document.getElementById('companyBreakdown');
            breakdownEl.innerHTML = '';
            const companies = Object.keys(summary.by_company);

            if (companies.length === 0) {
                breakdownEl.innerHTML = '<div class="text-sm text-gray-400">無紀錄</div>';
            } else {
                companies.forEach(comp => {
                    const compData = summary.by_company[comp];
                    const cDays = Math.floor(compData.hours / 8);
                    const cHours = compData.hours % 8;
                    const timeStr = cDays > 0 ? `${cDays} 天 ${cHours} 小時` : `${cHours} 小時`;

                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center bg-white p-2.5 rounded border text-sm';
                    item.innerHTML = `
                        <div>🏢 <span class="font-medium">${comp}</span></div>
                        <div class="text-right">
                            <span class="font-semibold">${timeStr}</span> | 
                            <span class="font-bold text-gray-900">$${compData.salary.toLocaleString()}</span>
                        </div>
                    `;
                    breakdownEl.appendChild(item);
                });
            }

            renderCalendarGrid(year, month, logs);
        }

        function renderCalendarGrid(year, month, logs) {
            const gridEl = document.getElementById('calendarGrid');
            gridEl.innerHTML = '';

            const firstDay = new Date(year, month - 1, 1).getDay();
            const totalDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-16 border rounded bg-gray-50';
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayLogs = logs[dateKey] || [];

                const dayCell = document.createElement('div');
                dayCell.className = `h-16 border rounded p-1 text-left relative text-xs flex flex-col justify-between cursor-pointer hover:border-blue-500 ${
                    dayLogs.length > 0 ? 'bg-black text-white' : 'bg-white text-gray-800'
                }`;
                dayCell.onclick = () => openAddModal(dateKey);

                let logContent = '';
                if (dayLogs.length > 0) {
                    const compName = dayLogs[0].company.substring(0, 2);
                    logContent = `<div class="bg-gray-800 text-white rounded px-1 py-0.5 text-[10px] truncate">1 筆工作 [${compName}...]</div>`;
                }

                dayCell.innerHTML = `
                    <div class="font-bold">${day}</div>
                    ${logContent}
                `;
                gridEl.appendChild(dayCell);
            }
        }

        function openAddModal(dateStr = '') {
            document.getElementById('modalTitle').textContent = '新增工時紀錄';
            document.getElementById('workForm').reset();
            document.getElementById('logId').value = '';
            if (dateStr) {
                document.getElementById('logDate').value = dateStr;
            } else {
                document.getElementById('logDate').valueAsDate = new Date();
            }
            document.getElementById('workModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('workModal').classList.add('hidden');
        }

        async function saveWorkLog(e) {
            e.preventDefault();
            const payload = {
                username: activeUser,
                date: document.getElementById('logDate').value,
                company: document.getElementById('logCompany').value,
                hours: parseFloat(document.getElementById('logHours').value),
                rate: parseFloat(document.getElementById('logRate').value),
                pay_mode: document.getElementById('logPayMode').value,
                status: document.getElementById('logStatus').value,
                location: document.getElementById('logLocation').value
            };

            const res = await fetch('/api/work', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeModal();
                renderDashboard();
            } else {
                alert('儲存失敗，請檢查資料欄位');
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        function openSettings() {
            alert('偏好設定功能維護中');
        }

        window.onload = init;
    </script>
</body>
</html>
