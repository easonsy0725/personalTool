<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工時與薪資記錄系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 sm:p-8 font-sans">
  <div id="app" class="max-w-4xl mx-auto space-y-6">
    
    <!-- 頂部頁首 -->
    <header class="flex justify-between items-center bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-xl font-bold text-slate-800">👷 工時管理 Dashboard</h1>
        <p class="text-xs text-slate-500 mt-1">
          歡迎，<span class="font-bold text-slate-900">{{ currentDisplayName }}</span> 
          <span class="text-slate-400 font-mono">({{ currentUser }})</span>
        </p>
      </div>
      <button @click="logout" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3.5 py-2 rounded-lg border border-red-200 font-medium transition">
        登出
      </button>
    </header>

    <!-- 使用者個人自訂 Display Name 設定區 -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <h3 class="text-sm font-bold text-slate-800 mb-3">👤 個人資料設定 (User Self-Service)</h3>
      <form @submit.prevent="updateMyProfile" class="flex items-center gap-3">
        <div class="flex-1 max-w-xs">
          <label class="block text-[11px] font-bold text-slate-400 mb-1">自訂顯示名稱 (Display Name)</label>
          <input 
            v-model="myDisplayName" 
            type="text" 
            required
            placeholder="請輸入欲顯示的姓名"
            class="w-full border border-slate-300 px-3 py-1.5 rounded text-xs focus:outline-none focus:border-blue-500">
        </div>
        <button 
          type="submit" 
          class="mt-5 bg-slate-900 hover:bg-black text-white px-4 py-1.5 rounded text-xs font-medium transition">
          更新個人姓名
        </button>
      </form>
    </section>

    <!-- 管理者專區：修改所有人的 Display Name 與權限 -->
    <section v-if="isAdmin" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <span>🛠️ 管理者控制台：全體使用者權限與顯示名稱修改</span>
          <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-mono">ADMIN</span>
        </h3>
        <button @click="loadAdminUsers" class="text-xs text-blue-600 hover:underline">重新整理</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-mono">
              <th class="p-2.5">帳號 (Username)</th>
              <th class="p-2.5">顯示名稱 (Display Name)</th>
              <th class="p-2.5">角色權限 (Role)</th>
              <th class="p-2.5">所屬公司 (Company)</th>
              <th class="p-2.5 text-center">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 font-mono">
            <tr v-for="user in allUsers" :key="user.username" class="hover:bg-slate-50">
              <td class="p-2.5 font-bold text-slate-700">{{ user.username }}</td>
              <td class="p-2.5 font-sans">
                <input 
                  v-model="user.display_name" 
                  type="text" 
                  class="w-full max-w-[150px] bg-white border border-slate-300 px-2 py-1 rounded text-xs focus:outline-none focus:border-blue-500">
              </td>
              <td class="p-2.5 font-sans">
                <select v-model="user.role" class="bg-white border border-slate-300 px-2 py-1 rounded text-xs focus:outline-none focus:border-blue-500">
                  <option value="employee">一般員工</option>
                  <option value="accounting">會計審核員</option>
                  <option value="admin">管理者</option>
                </select>
              </td>
              <td class="p-2.5 font-sans">
                <input 
                  v-model="user.company" 
                  type="text" 
                  class="w-full max-w-[120px] bg-white border border-slate-300 px-2 py-1 rounded text-xs focus:outline-none focus:border-blue-500">
              </td>
              <td class="p-2.5 text-center font-sans">
                <button 
                  @click="updateUserByAdmin(user)" 
                  class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-[11px] font-medium transition">
                  儲存
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup() {
        const currentUser = ref('');
        const currentDisplayName = ref('');
        const myDisplayName = ref('');
        const isAdmin = ref(false);
        const allUsers = ref([]);

        const fetchMe = async () => {
          const res = await fetch('/api/me');
          if (res.status === 401) { window.location.href = '/login.html'; return; }
          const data = await res.json();
          currentUser.value = data.username;
          currentDisplayName.value = data.display_name;
          myDisplayName.value = data.display_name;
          isAdmin.value = data.is_admin;
        };

        const updateMyProfile = async () => {
          const res = await fetch('/api/user/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ display_name: myDisplayName.value })
          });

          if (res.ok) {
            alert('個人顯示名稱更新成功！');
            await fetchMe();
            if (isAdmin.value) loadAdminUsers();
          } else {
            alert('更新失敗');
          }
        };

        const loadAdminUsers = async () => {
          if (!isAdmin.value) return;
          const res = await fetch('/api/admin/users');
          if (res.ok) {
            allUsers.value = await res.json();
          }
        };

        const updateUserByAdmin = async (user) => {
          const res = await fetch('/api/admin/users/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              target_user: user.username,
              display_name: user.display_name,
              role: user.role,
              company: user.company
            })
          });

          if (res.ok) {
            alert(`已成功更新 ${user.username} 的資料！`);
            await fetchMe();
            await loadAdminUsers();
          } else {
            alert('更新失敗');
          }
        };

        const logout = async () => {
          await fetch('/api/logout', { method: 'POST' });
          window.location.href = '/login.html';
        };

        onMounted(async () => {
          await fetchMe();
          if (isAdmin.value) {
            await loadAdminUsers();
          }
        });

        return {
          currentUser, currentDisplayName, myDisplayName, isAdmin, allUsers,
          updateMyProfile, loadAdminUsers, updateUserByAdmin, logout
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
