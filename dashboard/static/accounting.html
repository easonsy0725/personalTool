<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會計獨立審核模式</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 sm:p-8 font-sans">
  <div id="app" class="max-w-6xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center bg-white p-5 rounded-xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-xl font-bold text-slate-800">📊 會計獨立帳務稽核系統</h1>
        <p class="text-xs text-slate-500 font-mono mt-1">
          當前使用者: <span class="font-semibold text-slate-900">{{ currentDisplayName }}</span> ({{ currentUser }})
        </p>
      </div>
      <button @click="logout" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3.5 py-2 rounded-lg border border-red-200 font-medium transition">
        登出
      </button>
    </header>

    <!-- 管理者控制區塊：更改任何人的 Display Name -->
    <div v-if="isAdmin" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <span>👥 使用者 Display Name 與權限管理</span>
          <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-mono">ADMIN ONLY</span>
        </h3>
        <button @click="loadUsers" class="text-xs text-blue-600 hover:underline">重新整理列表</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-mono">
              <th class="p-2.5">帳號 (Username)</th>
              <th class="p-2.5">顯示名稱 (Display Name)</th>
              <th class="p-2.5">權限 (Role)</th>
              <th class="p-2.5">公司 (Company)</th>
              <th class="p-2.5 text-center">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 font-mono">
            <tr v-for="user in allUsers" :key="user.username" class="hover:bg-slate-50">
              <td class="p-2.5 font-bold text-slate-700">{{ user.username }}</td>
              <td class="p-2.5 font-sans">
                <input 
                  v-model="user.display_name" 
                  type="text" 
                  class="w-full max-w-[150px] border border-slate-300 px-2 py-1 rounded focus:outline-none focus:border-blue-500 text-xs">
              </td>
              <td class="p-2.5 font-sans">
                <select v-model="user.role" class="border border-slate-300 px-2 py-1 rounded focus:outline-none focus:border-blue-500 text-xs">
                  <option value="employee">一般員工</option>
                  <option value="accounting">會計審核員</option>
                  <option value="admin">管理者</option>
                </select>
              </td>
              <td class="p-2.5 font-sans">
                <input 
                  v-model="user.company" 
                  type="text" 
                  class="w-full max-w-[120px] border border-slate-300 px-2 py-1 rounded focus:outline-none focus:border-blue-500 text-xs">
              </td>
              <td class="p-2.5 text-center font-sans">
                <button 
                  @click="updateUserInfo(user)" 
                  class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded text-[11px] font-medium transition">
                  更新名稱
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup() {
        const currentUser = ref('');
        const currentDisplayName = ref('');
        const isAdmin = ref(false);
        const allUsers = ref([]);

        const fetchMe = async () => {
          const res = await fetch('/api/me');
          if (res.status === 401) { window.location.href = '/login.html'; return; }
          const data = await res.json();
          currentUser.value = data.username;
          currentDisplayName.value = data.display_name;
          isAdmin.value = data.is_admin;
        };

        const loadUsers = async () => {
          if (!isAdmin.value) return;
          const res = await fetch('/api/admin/users');
          if (res.ok) {
            allUsers.value = await res.json();
          }
        };

        const updateUserInfo = async (user) => {
          const res = await fetch('/api/admin/users/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              target_user: user.username,
              display_name: user.display_name,
              role: user.role,
              company: user.company
            })
          });

          if (res.ok) {
            alert(`已成功更新 ${user.username} 的 Display Name！`);
            await fetchMe();
            await loadUsers();
          } else {
            alert('更新失敗');
          }
        };

        const logout = async () => {
          await fetch('/api/logout', { method: 'POST' });
          window.location.href = '/login.html';
        };

        onMounted(async () => {
          await fetchMe();
          if (isAdmin.value) {
            await loadUsers();
          }
        });

        return {
          currentUser, currentDisplayName, isAdmin, allUsers,
          loadUsers, updateUserInfo, logout
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
